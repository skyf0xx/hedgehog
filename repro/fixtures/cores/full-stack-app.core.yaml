# Shipped core definition for full-stack-app: the source of truth for
# layer order, scope, and verify command per layer (`hedgehog core show`
# prints it).
# {module} is filled in by the compiler with the domain module name a
# task is generated for.
#
# Every per-module layer's scope carries {module} — module-disjoint by
# construction, so two modules' tasks never touch the same file
# (src/db/core.mjs's validateCore enforces this: a module-axis core
# rejects any non-exclusive layer whose scope omits {module}). schema and
# hook run Vitest anchored to their own module's directory (`nx test db
# -- src/schema/{module}/`), a distinct Nx target from typecheck under
# this workspace's target inference (nx.json), so the command's real
# radius is exactly its scope — no wider declaration to make. Cross-module
# type/integration breakage isn't caught at the task that caused it; join
# is exclusive: true and scoped to everything, running full typecheck and
# every test once after every module's layers land, in exchange for those
# layers running in parallel.
id: full-stack-app
pattern: vertical-slice
layer_shape_note: "Confirm against packages/config/eslint-base.js's depConstraints before\nwriting an import — a mismatch here is a pre-flight fact, not a lint\nfailure to discover later. Start from the generator and author only\nthis entity's delta on top of what it lands."
layers:
  - id: schema
    scope: ["packages/db/src/schema/{module}/**", "packages/db/src/schema/index.ts"]
    verify: "pnpm nx test db -- src/schema/{module}/"
    commit: "feat({module}): schema"
    tags: ["scope:db", "type:adapter"]
    depends_on_tags: []
    scaffold: "nx g ./tools/generators:schema --module={module} --fields='<name:type,...>'"
  - id: contract
    depends_on: schema
    scope: ["packages/contracts/src/{module}/**"]
    verify: "pnpm nx test contracts -- src/{module}/"
    commit: "feat({module}): contract"
    tags: ["scope:contracts", "type:contract"]
    depends_on_tags: ["type:adapter", "type:util"]
    scaffold: "nx g ./tools/generators:contract --module={module} --fields='<the schema layer's list>'"
  - id: repository
    depends_on: contract
    scope: ["libs/{module}/repository/**"]
    verify: "pnpm nx test {module}-repository"
    commit: "feat({module}): repository"
    tags: ["scope:{module}", "type:adapter"]
    depends_on_tags: ["type:adapter", "type:contract", "type:util"]
    scaffold: "nx g ./tools/generators:repository --module={module}"
  - id: service
    depends_on: repository
    scope: ["libs/{module}/service/**"]
    verify: "pnpm nx test {module}-service"
    commit: "feat({module}): service"
    tags: ["scope:{module}", "type:service"]
    depends_on_tags: ["type:adapter", "type:contract", "type:util"]
    scaffold: "nx g ./tools/generators:service --module={module}"
  - id: controller
    depends_on: service
    scope: ["apps/api/src/app/{module}/**"]
    verify: "pnpm nx test api -- src/app/{module}/"
    commit: "feat({module}): api"
    tags: ["scope:api"]
    depends_on_tags: ["type:adapter", "type:service", "type:contract", "type:util"]
    scaffold: "nx g ./tools/generators:controller --module={module} --fields='<the schema layer's list>'"
  - id: hook
    depends_on: controller
    scope: ["packages/hooks/src/{module}/**"]
    verify: "pnpm nx test hooks -- src/{module}/"
    commit: "feat({module}): hooks"
    tags: ["scope:hooks", "type:hook"]
    depends_on_tags: ["type:contract", "type:util"]
    scaffold: "nx g ./tools/generators:hook --module={module} [--toggleField=<boolField>]"
  # Web only, because apps/mobile only exists when the Mobile add-on is
  # on. A layer scoped to a project that was never scaffolded fails its
  # own verify on every module, so the Mobile clause is added by
  # hedgehog-bootstrap's Expo step — which is also what creates the Nx
  # project the extra verify target needs — rather than shipped here and
  # broken by default.
  - id: screen
    depends_on: hook
    scope: ["apps/web/src/app/{module}/**", "docs/design/{module}.md"]
    verify: "pnpm nx test web -- src/app/{module}/"
    commit: "feat({module}): screen-web"
    tags: ["scope:web"]
    depends_on_tags: ["scope:contracts", "scope:hooks", "scope:shared", "type:util"]
    scaffold: "nx g ./tools/generators:screen --module={module}   (skeleton only — UX is yours)"
  # Workspace-wide by design: the only gate that can see cross-module
  # breakage, since every layer above is parallel and module-scoped.
  - id: join
    depends_on: screen
    scope: ["**"]
    verify: "pnpm nx run-many -t typecheck && pnpm nx run-many -t test"
    exclusive: true
    commit: "chore({module}): join"
scope_hints:
  - match: ["packages/*/package.json", "packages/*/tsconfig*.json", "packages/*/vitest.config.ts", "packages/*/vitest.config.[cm]ts", "packages/*/project.json", "packages/*/eslint.config.js", "packages/*/eslint.config.[cm]js", "packages/*/src/index.ts", "libs/*/*/package.json", "libs/*/*/tsconfig*.json", "libs/*/*/vitest.config.ts", "libs/*/*/vitest.config.[cm]ts", "libs/*/*/project.json", "libs/*/*/eslint.config.js", "libs/*/*/eslint.config.[cm]js", "libs/*/*/src/index.ts"]
    hint: "package shell — if this layer is the first to create this package, widen just this task with `hedgehog override add` (see hedgehog-loop, \"First arrival in a package\") and retry"
  - match: ["pnpm-workspace.yaml", "pnpm-lock.yaml", "tsconfig.json", "nx.json", "package.json", "packages/config/**"]
    hint: "shared workspace config — no layer owns it; commit it separately as its own `chore(workspace): …` before retrying"
