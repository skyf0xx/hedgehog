# Shipped core definition for pwa-app: layer order, scope, verify
# command, and commit message per layer. {module} is filled in by the
# compiler with the domain module name a task is generated for.
#
# Every per-module layer's scope carries {module}, so the layers are
# module-disjoint. `schema`'s scope also lists the shared src/db/schema.ts
# barrel, which every module's schema layer appends one import and one
# .stores() line to; two modules' schema tasks therefore conflict on it
# and the scheduler serializes them. It also lists the Supabase migration
# a `--remote` module's schema layer writes. join is exclusive and scoped
# to everything: the backstop that catches cross-module breakage (or a
# Dexie version collision) the parallel per-module layers can't see.
id: pwa-app
pattern: vertical-slice
layers:
  - id: schema
    scope: ["src/features/{module}/data/{module}.schema.ts", "src/features/{module}/data/{module}.schema.spec.ts", "src/db/tables/{module}.table.ts", "src/db/schema.ts", "supabase/migrations/*_{module}.sql"]
    verify: "pnpm vitest run src/features/{module}/data/{module}.schema"
    commit: "feat({module}): schema"
  - id: repository
    depends_on: schema
    scope: ["src/features/{module}/data/**"]
    verify: "pnpm vitest run src/features/{module}/data/"
    commit: "feat({module}): repository"
  - id: hook
    depends_on: repository
    scope: ["src/features/{module}/hooks/**"]
    verify: "pnpm vitest run src/features/{module}/hooks/"
    commit: "feat({module}): hooks"
  - id: screen
    depends_on: hook
    scope: ["src/features/{module}/components/**", "src/features/{module}/index.ts", "src/app/{module}/**", "src/app/page.tsx"]
    verify: "pnpm vitest run src/features/{module}/components/"
    commit: "feat({module}): screen"
  # Workspace-wide by design: the only gate that can see cross-module
  # breakage, since every layer above is parallel and module-scoped.
  - id: join
    depends_on: screen
    scope: ["**"]
    verify: "pnpm typecheck && pnpm lint && pnpm vitest run && pnpm build"
    exclusive: true
    commit: "chore({module}): join"
