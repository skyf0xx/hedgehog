# Shipped core definition for copywriting. A linear chain of two layers:
# brief intake, then a draft-check-revise loop gated by checkCopy()
# rather than an agent's own self-report — the mechanism this core
# exists to provide (see hedgehog-copywriting-loop for the loop itself).
# `scripts/check-copy/` referenced below is this package's
# `workspace/scripts/check-copy/`, copied to the project root at
# install time — paths here are relative to the installed project, not
# the package.
id: copywriting
pattern: layered
layers:
  - id: brief
    scope: [".hedgehog/copy/00-brief.md"]
    verify: "test -s .hedgehog/copy/00-brief.md"
    commit: "chore(planning): copy brief"
  - id: draft
    depends_on: brief
    scope: [".hedgehog/copy/**", "scripts/check-copy/**"]
    # The universal AI-tell and prose contracts always run. `--brief`
    # adds the contract for the medium the copy ships into, read from the
    # brief's `type:` line (and `premium: true` for a tweet on X Premium):
    # character limits a platform enforces, structural slots the format is
    # defined by, and claims an ad network bans. A brief with no `type:`
    # line is gated as `prose`, which adds none of them. See
    # hedgehog-copywriting-loop's "Copy types" for the values and how the
    # fields are mined.
    verify: "node scripts/check-copy/index.mjs .hedgehog/copy/final.md --brief .hedgehog/copy/00-brief.md"
    commit: "feat(copy): draft"
