name: Bug report
description: Something in Hedgehog isn't working as expected
labels:
  - bug
  - needs-reproduction
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        Exact commands run, in order. Include the host (Claude Code, Cursor, Gemini CLI)
        and whether this is a fresh `hedgehog init` or an existing project.
      placeholder: |
        1. `hedgehog init --core full-stack-app`
        2. ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Hedgehog version
      description: Output of `hedgehog --version` or the version in package.json
    validations:
      required: true

  - type: input
    id: host
    attributes:
      label: Host / agent
      placeholder: "Claude Code / Cursor / Gemini CLI"
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: "OS, Node version, package manager"
    validations:
      required: false
