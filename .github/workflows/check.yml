name: Check

on:
  push:
    branches:
      - master
  pull_request:

# The read-only token and --ignore-scripts below are what make it safe to
# approve this workflow on a fork's pull request: the run gets a
# disposable runner, no repository write access and no secrets, and a
# contributor's package lifecycle scripts never execute. Keep it on
# `pull_request` — `pull_request_target` would hand the fork's code a
# token with write scope.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - run: npm install --ignore-scripts --no-audit --no-fund

      - run: npm run check

      # The reproductions are the evidence behind every bug fix in this
      # repo, and until now none of them ran here — `npm run check`
      # validates the payload, not behaviour. They take ~16s in total.
      #
      # Three of them (first-commit-rejected, commit-gate-fails-open,
      # commit-failure-recovery) install the pinned lefthook from the
      # registry into a throwaway directory, which they declare in their
      # own headers. That install is theirs, not this workflow's — the
      # `--ignore-scripts` above still applies to this repository's own
      # dependencies, and the job keeps its read-only token either way.
      - run: npm run repro
