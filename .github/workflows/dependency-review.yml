name: Dependency Review

on:
  pull_request:
    paths:
      - "package.json"
      - "**/package.json"
      - "package-lock.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
