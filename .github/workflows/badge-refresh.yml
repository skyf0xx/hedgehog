name: Refresh badges

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BADGE_REFRESH_TOKEN }}

      - name: Fetch badges
        run: |
          mkdir -p badges
          curl -fsSL "https://img.shields.io/npm/dt/%40skyf0xx%2Fhedgehog?style=for-the-badge" -o badges/npm-downloads.svg
          curl -fsSL "https://img.shields.io/github/stars/skyf0xx/hedgehog?style=for-the-badge" -o badges/github-stars.svg
          curl -fsSL "https://img.shields.io/badge/support-Ko--fi-FF5E5B?style=for-the-badge&logo=kofi&logoColor=white" -o badges/kofi.svg

      - name: Validate SVGs
        run: |
          for f in badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "Fetched file $f is not an SVG, aborting" >&2
              cat "$f" >&2
              exit 1
            fi
          done

      - name: Scale badges to 40px height
        run: |
          python3 - <<'PY'
          import re

          for path in ["badges/npm-downloads.svg", "badges/github-stars.svg", "badges/kofi.svg"]:
              with open(path) as f:
                  svg = f.read()

              m = re.search(r'width="([\d.]+)" height="([\d.]+)"', svg)
              orig_w, orig_h = float(m.group(1)), float(m.group(2))

              target_h = 40
              scale = target_h / orig_h
              new_w = round(orig_w * scale, 2)

              svg = svg.replace(
                  f'width="{m.group(1)}" height="{m.group(2)}"',
                  f'width="{new_w}" height="{target_h}" viewBox="0 0 {orig_w:g} {orig_h:g}"',
                  1,
              )

              with open(path, "w") as f:
                  f.write(svg)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg; then
            git add badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg
            git commit -m "chore: refresh badges"
            git push
          else
            echo "No change in badges, skipping commit"
          fi
