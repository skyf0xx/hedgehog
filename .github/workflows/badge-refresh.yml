name: Refresh badges

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BADGE_REFRESH_TOKEN }}

      - name: Fetch npm downloads badge
        run: |
          mkdir -p badges
          curl -fsSL "https://img.shields.io/npm/dt/%40skyf0xx%2Fhedgehog?style=for-the-badge" -o badges/npm-downloads.svg

      - name: Validate SVG
        run: |
          if ! grep -q "<svg" badges/npm-downloads.svg; then
            echo "Fetched file is not an SVG, aborting" >&2
            cat badges/npm-downloads.svg >&2
            exit 1
          fi

      - name: Scale badge to 40px height
        run: |
          python3 - <<'PY'
          import re

          path = "badges/npm-downloads.svg"
          with open(path) as f:
              svg = f.read()

          m = re.search(r'width="([\d.]+)" height="([\d.]+)"', svg)
          orig_w, orig_h = float(m.group(1)), float(m.group(2))

          target_h = 40
          scale = target_h / orig_h
          new_w = round(orig_w * scale, 2)

          svg = svg.replace(
              f'width="{m.group(1)}" height="{m.group(2)}"',
              f'width="{new_w}" height="{target_h}" viewBox="0 0 {orig_w:g} {orig_h:g}"',
              1,
          )

          with open(path, "w") as f:
              f.write(svg)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- badges/npm-downloads.svg; then
            git add badges/npm-downloads.svg
            git commit -m "chore: refresh npm downloads badge"
            git push
          else
            echo "No change in badge, skipping commit"
          fi
