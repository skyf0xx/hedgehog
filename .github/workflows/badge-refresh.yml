name: Refresh badges

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.BADGE_REFRESH_TOKEN }}

      - name: Compute total downloads across all packages
        id: downloads
        run: |
          total=0
          packages=$(python3 -c "
          import json
          data = json.load(open('src/registry/cores.json'))
          names = ['@skyf0xx/hedgehog']
          names += [c['package'] for c in data['cores']]
          print('\n'.join(names))
          ")
          while IFS= read -r pkg; do
            encoded=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1], safe=''))" "$pkg")
            count=$(curl -sSL "https://api.npmjs.org/downloads/range/2020-01-01:$(date +%Y-%m-%d)/$encoded" \
              | python3 -c "
          import json, sys
          try:
              data = json.load(sys.stdin)
              if 'error' in data:
                  print(0)
              else:
                  print(sum(d['downloads'] for d in data.get('downloads', [])))
          except Exception:
              print(0)
          ")
            echo "$pkg: $count"
            total=$((total + count))
          done <<< "$packages"
          echo "total=$total" >> "$GITHUB_OUTPUT"

      - name: Fetch badges
        run: |
          mkdir -p badges
          total_formatted=$(python3 -c "print(f'{${{ steps.downloads.outputs.total }}:,}')")
          curl -fsSL "https://img.shields.io/badge/downloads-${total_formatted}-blue?style=for-the-badge" -o badges/npm-downloads.svg
          curl -fsSL "https://img.shields.io/github/stars/skyf0xx/hedgehog?style=for-the-badge&color=gold" -o badges/github-stars.svg
          curl -fsSL "https://img.shields.io/badge/support-Ko--fi-FF5E5B?style=for-the-badge&logo=kofi&logoColor=white" -o badges/kofi.svg

      - name: Validate SVGs
        run: |
          for f in badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg; do
            if ! grep -q "<svg" "$f"; then
              echo "Fetched file $f is not an SVG, aborting" >&2
              cat "$f" >&2
              exit 1
            fi
          done

      - name: Scale badges to 40px height
        run: |
          python3 - <<'PY'
          import re

          for path in ["badges/npm-downloads.svg", "badges/github-stars.svg", "badges/kofi.svg"]:
              with open(path) as f:
                  svg = f.read()

              m = re.search(r'width="([\d.]+)" height="([\d.]+)"', svg)
              orig_w, orig_h = float(m.group(1)), float(m.group(2))

              target_h = 40
              scale = target_h / orig_h
              new_w = round(orig_w * scale, 2)

              svg = svg.replace(
                  f'width="{m.group(1)}" height="{m.group(2)}"',
                  f'width="{new_w}" height="{target_h}" viewBox="0 0 {orig_w:g} {orig_h:g}"',
                  1,
              )

              with open(path, "w") as f:
                  f.write(svg)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg; then
            git add badges/npm-downloads.svg badges/github-stars.svg badges/kofi.svg
            git commit -m "chore: refresh badges"
            git push
          else
            echo "No change in badges, skipping commit"
          fi
