name: Tag release

on:
  push:
    branches:
      - master
    paths:
      - package.json
  workflow_dispatch: {}

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.repository == 'skyf0xx/hedgehog'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # On a push, "before" is package.json at the pre-push state of the
      # branch (github.event.before), so any number of commits landing in
      # one push is still compared correctly. workflow_dispatch carries no
      # push event to read that from, so a manual run instead compares
      # against the version actually live on npm right now — the real
      # ground truth for whether this version still needs releasing.
      - id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          after=$(node -p 'require("./package.json").version')
          if [ -n "$BEFORE_SHA" ]; then
            before=$(git show "$BEFORE_SHA:package.json" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || echo "")
          else
            before=$(npm view "$(node -p 'require("./package.json").name')" version 2>/dev/null || echo "")
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      # Tagging and publishing run in one job, on the runner's own token,
      # rather than as separate workflows linked by a tag push: a tag
      # pushed by GITHUB_TOKEN does not trigger other workflows (GitHub's
      # anti-recursion guard on the default token), so a separate
      # `on: push: tags:` workflow would never fire.
      - if: steps.version.outputs.before != steps.version.outputs.after
        env:
          TAG: v${{ steps.version.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "$TAG" >/dev/null; then
            echo "Tag $TAG already exists on origin — a version bump must be committed unbumped, with tagging left to this workflow. Skipping tag/publish."
            exit 1
          fi
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - if: steps.version.outputs.before != steps.version.outputs.after
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm install -g npm@latest

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm install

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm run check

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm publish

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: gh release create "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
