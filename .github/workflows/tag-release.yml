name: Tag release

on:
  push:
    branches:
      - master
    paths:
      - package.json

permissions:
  contents: write
  id-token: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.repository == 'skyf0xx/hedgehog'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - id: version
        run: |
          before=$(git show HEAD^:package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version' 2>/dev/null || echo "")
          after=$(node -p 'require("./package.json").version')
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$after" >> "$GITHUB_OUTPUT"

      # Tagging and publishing run in one job, on the runner's own token,
      # rather than as separate workflows linked by a tag push: a tag
      # pushed by GITHUB_TOKEN does not trigger other workflows (GitHub's
      # anti-recursion guard on the default token), so a separate
      # `on: push: tags:` workflow would never fire.
      - if: steps.version.outputs.before != steps.version.outputs.after
        env:
          TAG: v${{ steps.version.outputs.after }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - if: steps.version.outputs.before != steps.version.outputs.after
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm install -g npm@latest

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm install

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm run check

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: npm publish

      - if: steps.version.outputs.before != steps.version.outputs.after
        run: gh release create "$TAG" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
