name: PR Policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            ci
            chore

  conflicts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check for merge conflicts with base branch
        run: |
          git config user.email "ci@local"
          git config user.name "ci"
          if ! git merge --no-commit --no-ff "origin/${{ github.base_ref }}"; then
            echo "::error::This PR has merge conflicts with ${{ github.base_ref }}. Please rebase."
            exit 1
          fi

  forbidden-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject direct edits to vendored BMAD tree
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- vendor-skills/BMAD)
          if [ -z "$CHANGED" ]; then
            exit 0
          fi
          # A sanctioned bmad-revendor pass always updates the pin in
          # ATTRIBUTION.md (see .claude/skills/bmad-revendor/SKILL.md step 6).
          # Its presence in the diff is the signal this is a real re-vendor,
          # not a hand-edit of a vendored file.
          if echo "$CHANGED" | grep -qx "vendor-skills/BMAD/ATTRIBUTION.md"; then
            exit 0
          fi
          echo "::error::vendor-skills/BMAD/ only changes via the bmad-revendor skill against a pinned upstream commit (which updates vendor-skills/BMAD/ATTRIBUTION.md). Direct edits found without an ATTRIBUTION.md pin update:"
          echo "$CHANGED"
          exit 1

      - name: Reject unexpected new package.json files
        run: |
          BASE="origin/${{ github.base_ref }}"
          NEW_MANIFESTS=$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- '**/package.json' ':!package.json')
          if [ -n "$NEW_MANIFESTS" ]; then
            echo "::error::New package.json in an unexpected location:"
            echo "$NEW_MANIFESTS"
            exit 1
          fi
