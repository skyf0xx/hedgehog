name: Stale

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          stale-issue-message: >
            This issue has had no activity for 60 days and is being marked
            stale. It will close in 14 days if there is no further activity.
          close-issue-message: >
            Closing due to inactivity. Feel free to reopen if this is still
            relevant.
          exempt-issue-labels: "needs-maintainer-review,good-first-issue"

          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          stale-pr-message: >
            This pull request has had no activity for 30 days and is being
            marked stale. It will close in 14 days if there is no further
            activity. External contributors: if you're still working on
            this, a comment or a rebase will keep it open.
          close-pr-message: >
            Closing due to inactivity. Feel free to reopen or open a new PR
            when it's ready for review.
          exempt-pr-labels: "needs-maintainer-review"

          operations-per-run: 100
